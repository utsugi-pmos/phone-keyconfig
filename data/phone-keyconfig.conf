# phone-keyconfig: the shipped defaults.
#
# Do not edit this file: a package update overwrites it. The app writes your
# changes to ~/.config/phone-keyconfig/phone-keyconfig.conf, which wins key by
# key over this one; a key you never changed keeps following the default.
#
# A binding is one of:
#   none                     do nothing
#   builtin:<id>             screen-toggle, power-menu, screenshot, torch-toggle,
#                            brightness-up, brightness-down
#   app:<desktop-id>         launch <desktop-id>.desktop (the file name without .desktop)
#   command:<shell>          run <shell> with /bin/sh -c, as the user

[timing]
# Hold power this long for the power menu.
hold_menu_ms=3000
# A second power press within this window after a short press is a double tap.
# The screen toggle of a short press waits for this window to close: that is
# the one cost of having a double tap at all.
double_tap_ms=300
# A volume key pressed up to this long BEFORE power still counts as the chord.
# Plain volume presses are held back by the same amount.
volume_forgiveness_ms=150

[bindings]
# Power released after a short press, nothing else pressed meanwhile.
power_release=builtin:screen-toggle
# Power held for hold_menu_ms.
power_hold=builtin:power-menu
# Volume-up / volume-down while power is held (before the menu).
power_volume_up=builtin:brightness-up
power_volume_down=builtin:screenshot
# Power pressed twice within double_tap_ms.
double_tap=builtin:torch-toggle

[hardware]
# The flash LED's brightness file. Plasma Mobile's own udev rule
# (99-flashlight.rules) makes it writable by everyone for its flashlight tile.
torch_led=/sys/class/leds/white:flash/brightness
# 0-255 on this phone. Well under the maximum: this is a camera flash used as a
# torch, and the maximum is meant for a strobe, not for being left on.
torch_brightness=100
# Each brightness step, as a percentage of the display's maximum.
brightness_step_percent=10
